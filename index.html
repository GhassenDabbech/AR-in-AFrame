<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <!-- Neuere A-Frame Version -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            background: transparent !important;
        }

        #qrcode {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <div id="qrcode" style="margin: 20px;"></div>

    <a-scene renderer="alpha:true; colorManagement:true;" background="color: transparent" xr-mode-ui="XRMode: ar"
        webxr="requiredFeatures: hand-tracking, local-floor; optionalFeatures: hit-test">

        <a-camera position="0 1.6 0">
            <a-entity id="debug-text"
                      position="0 -0.3 -0.5" 
                      text="value: Waiting for input...; align: center; color: white;" 
                      geometry="primitive: plane; width: 0.5; height: 0.1"
                      material="color: #333; opacity: 0.5">
            </a-entity>
        </a-camera>

        <a-light type="ambient" intensity="1"></a-light>

        <a-light type="directional" intensity="1" position="-1 2 1">
        </a-light>

        <a-entity class="hand" hand-tracking-controls="hand: left">
        </a-entity>

        <a-entity class="hand" hand-tracking-controls="hand: right">
        </a-entity>

        <a-entity id="model" class = "interactive" position="0 1.5 -1" rotation="0 0 0" scale="0.1 0.1 0.1">
        </a-entity>
    </a-scene>

    <script>
        const scene = document.querySelector("a-scene");
        const debugText = document.getElementById("debug-text");
        const model = document.getElementById("model");

        // Load model
        const modelUrl = decodeURIComponent(location.search.substring(1));
        if (modelUrl) model.setAttribute("gltf-model", modelUrl);

        function logToVR(msg) {
            debugText.setAttribute("text", "value: " + msg);
        }

        // This loop runs every frame
        scene.renderer.setAnimationLoop(() => {
            const xrSession = scene.renderer.xr.getSession();
            if (!xrSession) {
                logToVR("Start AR Mode");
                return;
            }

            // Access raw WebXR input sources
            const inputSources = xrSession.inputSources;
            let foundHand = null;

            for (let source of inputSources) {
                if (source.hand) {
                    foundHand = source;
                    break;
                }
            }

            if (!foundHand) {
                logToVR("Move hands in view");
                return;
            }

            // Get the wrist position (the most stable part of the hand)
            const wrist = foundHand.hand.get("wrist");
            if (wrist) {
                const handPos = new THREE.Vector3().setFromMatrixPosition(wrist.jointPose.transform.matrix);
                const objPos = new THREE.Vector3();
                model.object3D.getWorldPosition(objPos);

                const dist = handPos.distanceTo(objPos);
                logToVR("Dist: " + dist.toFixed(2));

                if (dist < 0.15) {
                    logToVR("Grabbed!");
                    // Attach model to the hand's local coordinate system
                    foundHand.hand.get("wrist").object3D.add(model.object3D);
                }
            }
        });
        scene.addEventListener("enter-vr", () => {

            // Falls versehentlich VR gestartet wird -> sofort wieder verlassen
            if (scene.is("vr-mode") && !scene.is("ar-mode")) {
                scene.exitVR();
                return;
            }

            scene.renderer.setClearColor(0x000000, 0);

        });
        //QR-Code generieren
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href, //holt die aktuelle URL
            width: 300,
            height: 300,
        });
    </script>

</body>

</html>
