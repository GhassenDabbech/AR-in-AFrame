
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <!-- Neuere A-Frame Version -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        html, body {
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:transparent;
        }

        canvas{
            background:transparent !important;
        }

        #qrcode {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>
  <div id="qrcode" style="margin: 20px;"></div>

<a-scene
    renderer="alpha:true; colorManagement:true;"
    background="color: transparent"
    xr-mode-ui="XRMode: ar"
    webxr="requiredFeatures: local-floor; optionalFeatures: hit-test">

    <a-camera position="0 1.6 0"></a-camera>

    <a-light type="ambient" intensity="1"></a-light>

    <a-light
        type="directional"
        intensity="1"
        position="-1 2 1">
    </a-light>

    <a-entity
        id="model"
        position="0 1.5 -1"
        rotation="0 0 0"
        scale="1 1 1">
    </a-entity>

</a-scene>

<script>

const modelUrl = decodeURIComponent(location.search.substring(1));

const model = document.getElementById("model");

if(modelUrl.length){
    model.setAttribute("gltf-model", modelUrl);
}else{
    alert("Kein Modell angegeben.");
}

const scene = document.querySelector("a-scene");

scene.addEventListener("loaded",()=>{

    // transparenter Hintergrund
    scene.renderer.setClearColor(0x000000,0);

    // VR-Button komplett deaktivieren
    scene.setAttribute("vr-mode-ui","enabled:false");

});

scene.addEventListener("enter-vr",()=>{

    // Falls versehentlich VR gestartet wird -> sofort wieder verlassen
    if(scene.is("vr-mode") && !scene.is("ar-mode")){
        scene.exitVR();
        return;
    }

    scene.renderer.setClearColor(0x000000,0);

});
//QR-Code generieren
    new QRCode(document.getElementById("qrcode"), {
        text: window.location.href, //holt die aktuelle URL
        width: 300,
        height: 300,
    });
</script>

</body>
</html>
