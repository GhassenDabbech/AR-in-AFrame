<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <!-- Neuere A-Frame Version -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            background: transparent !important;
        }
    </style>
</head>

<body>
    <!----------------------------------------------- SCENE SETUP ----------------------------------------------->
    <a-scene renderer="alpha:true; colorManagement:true;" background="color: transparent" xr-mode-ui="XRMode: ar"
        webxr="requiredFeatures: hand-tracking, local-floor; optionalFeatures: hit-test">

        <a-camera position="0 1.6 0">
            <!-- Console to debug (cause the quest browser doesn't have one) -->
            <a-entity id="debug-text"
                      visible = "true"
                      position="0 -0.3 -0.5" 
                      text="value: Waiting for input...; align: center; color: white;" 
                      geometry="primitive: plane; width: 0.5; height: 0.1"
                      material="color: #333; opacity: 0.5">
            </a-entity>
        </a-camera>

        <a-light type="ambient" intensity="1"></a-light>

        <a-light type="directional" intensity="1" position="-1 2 1">
        </a-light>
    
    <!----------------------------------------------- HANDS ----------------------------------------------->
        <a-entity id="leftHand" class="hand" hand-tracking-controls="hand: left">
            <a-text
                value = "CONTROLS:
                        • Fist: Grab object.
                        • 2 Fists: Scale object.
                        • Thumbs up: Add new object.
                        • Cross arms: Reset all objects."
                scale = "0.025, 0.025, 0.025"
                color = "black"
                rotation = "-90 90 180"
                position = "0.005 -0.02 0.005"
                font = "https://raw.githubusercontent.com/etiennepinchon/aframe-fonts/master/fonts/caveat/Caveat-Regular.json"
                shader = "msdf">
            </a-text>
        </a-entity>

        <a-entity id="rightHand" class="hand" hand-tracking-controls="hand: right">
        </a-entity>
    
    <!----------------------------------------------- MODEL ----------------------------------------------->
        <a-entity id="model" class = "grabbable" position="0 1.5 -1" rotation="0 0 0" scale="0.1 0.1 0.1">
        </a-entity>
    </a-scene>

    <!-- QR Scanner to add new objects -->
    <div id="debug-html" style="position:fixed; top:10px; left:10px; z-index:1001; background:rgba(0,0,0,0.7); color:white; padding:10px; font-family:monospace; font-size:14px; max-width:90%"></div>
    
    <a id="scan-link" href="qr2ar://scan" style="display:none ;position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1002; text-align:center; background:white; color:black; padding:30px 50px; text-decoration:none; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.3); font-family:sans-serif;">
    <div style="font-size:32px; margin-bottom:8px;">📷</div>
    <div style="font-size:22px; font-weight:bold;">Tap to Scan New Object</div>
    <div style="font-size:14px; color:#666; margin-top:6px;">Opens the QR scanner</div>
    </a>

    <a id="shared-view-link" href="" style="position:fixed; bottom:20px; left:20px; z-index:1002; font-size:18px; background:white; color:black; padding:15px 25px; text-decoration:none; border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,0.3); font-family:sans-serif;">Shared View</a>
    <!----------------------------------------------- SETUP ----------------------------------------------->
    <script>
        const scene = document.querySelector("a-scene");
        const debugText = document.getElementById("debug-text");
        const model = document.getElementById("model");
        const leftHand = document.getElementById("leftHand");
        const rightHand = document.getElementById("rightHand");

        const grabDist = 0.2;
        let leftGrabbed = null;
        let rightGrabbed = null;

        //For 2-fists:
        let twoHandsActive = false;
        let twoHandsStartDist = 0;
        let twoHandStartScale = 1;

        let twoHandsStartMidpoint = new THREE.Vector3();
        let twoHandsStartPos = new THREE.Vector3();

        let twoHandsStartDir = new THREE.Vector3(); // For 2-fist-rotation
        let twoHandsStartQuat = new THREE.Quaternion(); // For 2-fist- rotation

        let crossTimer = 0 // For reset

        let thumbsUpTimer = 0;
        let awaitingScanResult = false;
        let scanRequested = false;
    
        model.addEventListener("loaded", () => {
            objects[0] = {
                el: model,
                ogPos: model.object3D.position.clone(),
                ogRot: model.object3D.quaternion.clone(),
                ogScale: model.object3D.scale.clone(),
            };
        });

        // For idle animation:
        let idleActive = false;
        let idleTime = 0;
        let idleWaitTime = 0;

        const IDLE_SPEED = 0.5;

        let scanTriggerTimer = 0;

        let selectListenerAdded = false;
        let objects = [];
        let lastKnownScanUrl = "";

        // Load model
        const modelUrl = decodeURIComponent(location.search.substring(1));
        if (modelUrl) model.setAttribute("gltf-model", modelUrl);

        // send to AR-console to debug
        function logToVR(msg) {
            //return; // Delete this to turn on console
            debugText.setAttribute("text", "value: " + msg);
            const htmlDebug = document.getElementById("debug-html");
            if (htmlDebug) htmlDebug.textContent = msg;
        }

        window.addEventListener("error", (e) => {
            logToVR("javascrpt error: " + e.message + "@line " + e.lineno);
        });

        window.addEventListener("unhandledrejection", (e) => {
            logToVR("promise error: " + ( e.reason && e.reason.message  ? e.reason.message : e.reason));
        });
        

        async function exitARforScan() {
            const xrSession = scene.renderer.xr.getSession();
            if (!xrSession) return;

            logToVR('ending session');
            xrSession.addEventListener("end", async () => {
                logToVR("session ended");

                const overlay = document.getElementById("scanner-overlay");
                const video = document.getElementById("qr-video");

                overlay.style.display = "block";
                
                setTimeout(async () => {
                    awaitingScanResult = true;
                    logToVR("awaiting scan result");
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                        video.srcObject = stream;
                        logToVR("cam live");
                    } catch (err) {
                        //logToVR("cam fail: " + err.message);
                    }
                }, 2000);
            }, {once: true});

            await xrSession.end();
        }

        //<------------------------------------------- FIST DETECTION ------------------------------------------->
        let leftClosed = false;
        let rightClosed = false;

        function jointPos(joint, frame, refSpace) {
            const pose = frame.getJointPose(joint, refSpace);
            if (!pose) return null;
            return new THREE.Vector3().setFromMatrixPosition(new THREE.Matrix4().fromArray(pose.transform.matrix));
        }

        function fistDistance(hand, frame, refSpace) {
            const wrist = hand.get("wrist");
            const indexTip = hand.get("index-finger-tip");
            const middleTip = hand.get("middle-finger-tip");
            if (!wrist || !indexTip || !middleTip) return null;

            const wristPos = jointPos(wrist, frame, refSpace);
            const indexPos = jointPos(indexTip, frame, refSpace);
            const middlePos = jointPos(middleTip, frame, refSpace);
            if (!wristPos || !indexPos || !middlePos) return null;

            return (wristPos.distanceTo(indexPos) + wristPos.distanceTo(middlePos)) / 2;
            //const avgDist = (wristPos.distanceTo(indexPos) + wristPos.distanceTo(middlePos)) / 2;
            //return avgDist < 0.06;
        }

        const FIST_THRESHOLD = 2.20;

        //I tested hand tracking with my own hand dimensions
        //TO DO: Make it work for all hand sizes (!!Wichtig!!)
        function getHandSize(hand, frame, refSpace) {
            const wrist = hand.get("wrist");
            const middleMtc = hand.get("middle-finger-metacarpal");
            if (!wrist || !middleMtc) return null;
            
            const wristPos = jointPos(wrist, frame, refSpace);
            const mtcPos = jointPos(middleMtc, frame, refSpace);
            if (!wristPos || !mtcPos) return null;

            return wristPos.distanceTo(mtcPos);
        }

        function isThumbsUp(hand, frame, refSpace){
            const thumbTip = hand.get("thumb-tip");
            const indexTip = hand.get("index-finger-tip");
            if (!thumbTip || !indexTip) return false;

            const thumbPos = jointPos(thumbTip, frame, refSpace);
            const indexPos = jointPos(indexTip, frame, refSpace);
            if (!thumbPos || !indexPos) return false;

            const size = getHandSize(hand, frame, refSpace);
            const curl = fistDistance(hand, frame, refSpace);
            if (!size || curl === null) return false;

            const curlRatio = curl / size;
            const thumbSeparation = thumbPos.distanceTo(indexPos) / size;
            //logToVR("sep:" + thumbSeparation.toFixed(2) + " curl:" + curlRatio.toFixed(2));


            return curlRatio < FIST_THRESHOLD && thumbSeparation > THUMB_THRESHOLD
        }

        const THUMB_THRESHOLD = 2.0;

        function getFistRatio(hand, frame, refSpace) {
            const curl = fistDistance(hand, frame, refSpace);
            const size = getHandSize(hand, frame, refSpace);
            if (curl === null || size === null) return null;

            return curl / size;
        }

        // Useful for 2-fist-scaling
        function getWristPos(handEl) {
            const wristObj = handEl.object3D.getObjectByName("wrist");
            if (!wristObj) return null;
            const pos = new THREE.Vector3();
            wristObj.getWorldPosition(pos);
            return pos;
        }

        function getHandDir(leftPos, rightPos){   //Useful for 2-fist-rotation
            return new THREE.Vector3().subVectors(rightPos, leftPos).normalize();
        }

        function isCrossed(leftPos, rightPos, leftIsFist, rightIsFist) { // Last 2 params are local
            if (leftIsFist || rightIsFist) return false;

            const swapped = leftPos.x > rightPos.x
            const closeHorizontally = Math.abs(leftPos.x - rightPos.x) < 0.3;
            const sameHeight = Math.abs(leftPos.y - rightPos.y) < 0.3;

            return swapped && closeHorizontally && sameHeight
        }

        function getNearest(objects, pos, maxDist){
            let target = null;
            let nearestDist = maxDist;

            for (const obj of objects) {
                const objPos = new THREE.Vector3();
                obj.el.object3D.getWorldPosition(objPos);
                const dist = pos.distanceTo(objPos);
                if (dist < nearestDist) {
                    target = obj;
                    nearestDist = dist;
                }
            }
            return target;
        }

        let rightEdge = 0;
        function getWidth(entity){
            const bbox = new THREE.Box3().setFromObject(entity.object3D); //Bounding box
            const width = bbox.max.x - bbox.min.x;
            return width;
        }

        //<----------------------------------- MAIN LOOP (runs every frame) ----------------------------------->
        AFRAME.registerComponent("hand-grabber", {
            tick: async function (time, delta) { // delta = time since last frame.    time and delta are only used for reset and animation
                const frame = scene.frame;
                if (!frame) return;

                const xrSession = scene.renderer.xr.getSession();
                if (!xrSession) return;
                const refSpace = scene.renderer.xr.getReferenceSpace();

                for (const source of xrSession.inputSources) {
                    if (source.hand) {
                        logToVR(Array.from(source.hand.keys()).join(", "));
                    }
                }

                if (awaitingScanResult) {
                    try {
                        const response = await fetch("http://localhost:55555/");
                        const url = decodeURIComponent(await response.text());
                        if (url && url !== lastKnownScanUrl) {
                            lastKnownScanUrl = url;
                            awaitingScanResult = false;
                            logToVR("spawning: " + url);
                            spawnObject(url);
                        }
                    } catch (err) {}
                }
            

                for (const source of xrSession.inputSources) {
                    if (!source.hand) continue;
                    const ratio = getFistRatio(source.hand, frame, refSpace);
                    if (ratio === null) continue;

                    const closed = ratio < FIST_THRESHOLD;
                    //logToVR(source.handedness + " ratio:" + ratio.toFixed(2));

                    if (source.handedness === "left") {
                        if (closed && !leftClosed) grab(leftHand); //means hand is a fist now, but wasn't before
                        if (!closed && leftClosed) release(leftHand);
                        leftClosed = closed;
                    } else if (source.handedness === "right") {
                        if (closed && !rightClosed) grab(rightHand);
                        if (!closed && rightClosed) release(rightHand);
                        rightClosed = closed;
                    }
                }
                // 2-FIST-MODE:
                if (leftClosed && rightClosed && leftGrabbed && leftGrabbed === rightGrabbed) {
                    const target = leftGrabbed; //same as right
                    const leftPos = getWristPos(leftHand);
                    const rightPos = getWristPos(rightHand);

                    if (leftPos && rightPos){ // if they're not null
                        const dist = leftPos.distanceTo(rightPos);
                        if (!twoHandsActive) {
                            // Reparent to scene manually (after it was attached to 1 hand)
                            // previously used attach(), which caused the model to teleport
                            const worldPos = new THREE.Vector3();           // Empty vector to hold model's real position
                            target.el.object3D.getWorldPosition(worldPos);          // Read it

                            const worldQuat = new THREE.Quaternion();       // Empty vector to hold model's real rotation
                            target.el.object3D.getWorldQuaternion(worldQuat);       // Read it

                            const worldScale = new THREE.Vector3();         // Empty vector to hold model's real size
                            target.el.object3D.getWorldScale(worldScale);           // Read it

                            scene.object3D.add(target.el.object3D);

                            target.el.object3D.position.copy(worldPos);     // Put position back
                            target.el.object3D.quaternion.copy(worldQuat);  // Put rotation back
                            target.el.object3D.scale.copy(worldScale);      // Put size back

                            twoHandsStartQuat.copy(worldQuat)   // For 2-Fist-Rotation

                            twoHandsStartDist = dist;
                            twoHandStartScale = worldScale.x; // world scale instead of local scale, & only need 1 axis since they're all equal
                            twoHandsActive = true;

                            // needed to fix sudden teleport bug when scaling:
                            const startMid = new THREE.Vector3().addVectors(leftPos, rightPos).multiplyScalar(0.5);
                            twoHandsStartMidpoint.copy(startMid);
                            twoHandsStartPos.copy(target.el.object3D.position);

                            // needed for 2-fist-Rotation
                            twoHandsStartDir.copy(getHandDir(leftPos, rightPos));
                        } else {
                            const scaleFactor = dist / twoHandsStartDist;
                            const newScale = twoHandStartScale * scaleFactor;
                            target.el.object3D.scale.set(newScale, newScale, newScale);

                            // TO DO: Make model move while in 2-fist mode
                            // (+ fix sudden teleport bug when scaling)
                            const midPoint = new THREE.Vector3().addVectors(leftPos, rightPos).multiplyScalar(0.5);
                            const moved = new THREE.Vector3().subVectors(midPoint, twoHandsStartMidpoint);
                            const newPos = new THREE.Vector3().addVectors(twoHandsStartPos, moved);
                            target.el.object3D.position.copy(newPos);

                            // TO DO: Make model rotate while in 2-fist-mode
                            const currentDir = getHandDir(leftPos, rightPos);
                            const deltaQuat = new THREE.Quaternion().setFromUnitVectors(twoHandsStartDir, currentDir);
                            target.el.object3D.quaternion.copy(deltaQuat).multiply(twoHandsStartQuat);
                        }
                    }
                } else {
                    twoHandsActive = false; // Turn off 2-fist mode
                }

                // RESET GESTURE (Crossed arms for 2s)
                const leftWristPos = getWristPos(leftHand);
                const rightWristPos = getWristPos(rightHand);

                if (leftWristPos && rightWristPos && isCrossed(leftWristPos, rightWristPos, leftClosed, rightClosed)){
                    crossTimer += delta / 1000;
                    if (crossTimer >= 1) {
                        resetModel();
                        crossTimer = 0;
                    }
                } else {
                    crossTimer = 0;
                }

                //IDLE ANIMATION
                if (!leftGrabbed && !rightGrabbed && !twoHandsActive) {
                    idleWaitTime += delta / 1000;

                    if (idleWaitTime >= 10){
                            if (!idleActive) {
                                for (const obj of objects) {
                                    obj.idleAnchor = obj.el.object3D.position.clone();
                                }
                            idleTime = 0;
                            idleActive = true;
                        }
                        idleTime += delta / 1000;

                        const offsetY = Math.sin(idleTime * 0.5) * 0.02;

                        for (const obj of objects) {
                            obj.el.object3D.position.set(obj.idleAnchor.x, obj.idleAnchor.y + offsetY, obj.idleAnchor.z);
                            obj.el.object3D.rotation.y += IDLE_SPEED * (delta / 1000);
                        }
                    } 
                } else {
                    idleWaitTime = 0;
                    idleActive = false;
                }

                // Cam scan test:
                /*if (!leftClosed && !rightClosed) {
                    scanTriggerTimer += delta / 1000;
                    if (scanTriggerTimer >=1){
                        testExitAndScan();
                        scanTriggerTimer = 0;
                    }
                } else {
                    scanTriggerTimer = 0;
                }*/

                //Add objects
                let anyThumbsUp = false;
                for (const source of xrSession.inputSources) {
                    if (!source.hand) continue;
                    if (isThumbsUp(source.hand, frame, refSpace)) anyThumbsUp = true;
                }
                if (anyThumbsUp) {
                    thumbsUpTimer += delta / 1000;
                    if (thumbsUpTimer >= 1) {
                        logToVR("exiting ar to show scan button");
                        xrSession.end();
                        document.getElementById("scan-link").style.display = "block";
                        //window.location.href = "qr2ar://scan";
                        thumbsUpTimer = 0;
                    }
                } else {
                    thumbsUpTimer = 0;
                }
                if (xrSession && !selectListenerAdded) {
                    selectListenerAdded = true;
                    xrSession.addEventListener("select", () => {
                        logToVR("select ok, opening app");
                        window.location.href = "qr2ar://scan";
                    });
                }
            }
        // TO DO: ADD INTERACTION FOR NEW OBJECTS
        });

        scene.setAttribute("hand-grabber", "");
        document.getElementById("shared-view-link").addEventListener("click", (e) => {
            e.preventDefault();
            const sharedViewBase = "https://ar-gemeinsam.onrender.com/";
            const sharedViewRoom = prompt("Enter room name:") || "test";
            const finalUrl = sharedViewBase + "?room=" + encodeURIComponent(sharedViewRoom) + "&model=" + encodeURIComponent(modelUrl);
            window.open(finalUrl, "_blank");
        });

        document.getElementById("scan-link").addEventListener("click", () => {
            scanRequested = true;
        });

        function resetModel(){
            for (const obj of objects) {
                scene.object3D.add(obj.el.object3D); // Auto-detach from hand
                obj.el.object3D.position.copy(obj.ogPos);
                obj.el.object3D.quaternion.copy(obj.ogRot);
                obj.el.object3D.scale.copy(obj.ogScale);
            }
            //logToVR("reset pos: " + model.object3D.position.x.toFixed(2) + " " + model.object3D.position.y.toFixed(2) + " " + model.object3D.position.z.toFixed(2));

            leftGrabbed = null;
            rightGrabbed = null;
            twoHandsActive = false;
            //logToVR("Reset");
        }

        function spawnObject(url) {
            const entity = document.createElement("a-entity");
            entity.setAttribute("visible", "false"); // Hide until correctly placed
            logToVR("SPWNTEST running");
        
            entity.addEventListener("model-loaded", () => {

                const width = getWidth(entity);

                const x = rightEdge + width / 2 + 0.1; //+space btween objects
                rightEdge = x + width / 2;

                entity.object3D.position.set(x, 1.5, -1);
                entity.setAttribute("visible", "true");

                logToVR("model loaded ok: " + url);
                objects.push({
                    el: entity,
                    ogPos: entity.object3D.position.clone(),
                    ogRot: entity.object3D.quaternion.clone(),
                    ogScale: entity.object3D.scale.clone(),
                }); //Adds new object and its original state to objects list
            });

            entity.addEventListener("model-error", (err) => {
                logToVR(url + " failed to load: " + JSON.stringify(err.detail));
            });

            entity.setAttribute("gltf-model", url);
            entity.setAttribute("position", "0 1.5 -1");
            entity.setAttribute("scale", "0.1 0.1 0.1");
            scene.appendChild(entity);
        }

        // GRAB & RELEASE
        function grab(handEl) {
            const isLeft = (handEl === leftHand); 
            const isRight = (handEl === rightHand);

            if (isLeft){
                if (leftGrabbed) return;
            } else if (isRight){
                if (rightGrabbed) return;
            }

            const wristObj = handEl.object3D.getObjectByName("wrist");
            if (!wristObj) return;

            const handPos = new THREE.Vector3();
            wristObj.getWorldPosition(handPos);

            const target = getNearest(objects, handPos, grabDist);
            if (target) {
                if (isLeft) leftGrabbed = target;
                else if (isRight) rightGrabbed = target;
                wristObj.attach(target.el.object3D);
            }
        }

        function release(handEl) {
            const isLeft = (handEl === leftHand); 
            const isRight = (handEl === rightHand);

            let target;
            if (isLeft) {
                target = leftGrabbed;
            } else if (isRight) {
                target = rightGrabbed;
            }
            if (!target) return;

            scene.object3D.attach(target.el.object3D);
            if (isLeft) leftGrabbed = null;
            else if (isRight) rightGrabbed = null;
            logToVR("Released");

            const newestWidth = getWidth(target.el);
            const edge = target.el.object3D.position.x + (newestWidth / 2);
            if (edge > rightEdge) rightEdge = edge;
        }

        //<----------------------------------- AR MODE SAFETY ----------------------------------->
        scene.addEventListener("enter-vr", () => {
            // Falls versehentlich VR gestartet wird -> sofort wieder verlassen
            if (scene.is("vr-mode") && !scene.is("ar-mode")) {
                scene.exitVR();
                return;
            }
            scene.renderer.setClearColor(0x000000, 0);
            if (scanRequested) {
                awaitingScanResult = true; //starts polling everytime AR is entered or resumed
                scanRequested = false;
            }
        });
        
    </script>

</body>

</html>
