<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <!-- Neuere A-Frame Version -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        canvas {
            background: transparent !important;
        }

        #qrcode {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
        }
    </style>
</head>

<body>
    <div id="qrcode" style="margin: 20px;"></div>

    <a-scene renderer="alpha:true; colorManagement:true;" background="color: transparent" xr-mode-ui="XRMode: ar"
        webxr="requiredFeatures: hand-tracking, local-floor; optionalFeatures: hit-test"
        hand-tracking-controls="enabled: true">

        <a-camera position="0 1.6 0">
            <a-entity id="debug-text"
                      position="0 -0.3 -0.5" 
                      text="value: Waiting for input...; align: center; color: white;" 
                      geometry="primitive: plane; width: 0.5; height: 0.1"
                      material="color: #333; opacity: 0.5">
            </a-entity>
        </a-camera>

        <a-light type="ambient" intensity="1"></a-light>

        <a-light type="directional" intensity="1" position="-1 2 1">
        </a-light>

        <a-entity class="hand" hand-tracking-controls="hand: left">
        </a-entity>

        <a-entity class="hand" hand-tracking-controls="hand: right">
        </a-entity>

        <a-entity id="model" class = "interactive" position="0 1.5 -1" rotation="0 0 0" scale="0.1 0.1 0.1">
        </a-entity>
    </a-scene>

    <script>
        function logToVR(msg) {
            const debugText = document.getElementById("debug-text");
            debugText.setAttribute("text", "value: " + msg);
        }

        const modelUrl = decodeURIComponent(location.search.substring(1));
        const model = document.getElementById("model");

        if (modelUrl.length) {
            model.setAttribute("gltf-model", modelUrl);
        } else {
            alert("Kein Modell angegeben.");
        }

        const scene = document.querySelector("a-scene");

        scene.addEventListener("loaded", () => {
            // transparenter Hintergrund
            scene.renderer.setClearColor(0x000000, 0);

            // VR-Button komplett deaktivieren
            scene.setAttribute("vr-mode-ui", "enabled:false");

            const hands = document.querySelectorAll('[hand-tracking-controls]');

            let heldObject = null; //relevant für später, wenn wir mehrere Objekte haben.

            function updateLoop() {
                const hands = document.querySelectorAll('[hand-tracking-controls]');
                const interactables = document.querySelectorAll('.interactive');

                if (hands.length === 0 || interactables.length === 0) {
                    logToVR("Waiting for input...");
                } else {
                    hands.forEach(hand => {
                        const handPos = new THREE.Vector3();
                        hand.object3D.getWorldPosition(handPos);
                        
                        // Check if hand is actually active (not at 0,0,0)
                        if (handPos.length() < 0.1) return;

                        const objPos = new THREE.Vector3();
                        interactables[0].object3D.getWorldPosition(objPos);
                        
                        const dist = handPos.distanceTo(objPos);
                        logToVR("Dist: " + dist.toFixed(2));

                        if (dist < 0.5 && !heldObject) {
                            heldObject = interactables[0];
                            hand.object3D.attach(heldObject.object3D);
                            logToVR("Grabbed!");
                        }
                    });
                }
                requestAnimationFrame(updateLoop);
            }
            scene.addEventListener("enter-vr", updateLoop, { once: true });

        });
        scene.addEventListener("enter-vr", () => {

            // Falls versehentlich VR gestartet wird -> sofort wieder verlassen
            if (scene.is("vr-mode") && !scene.is("ar-mode")) {
                scene.exitVR();
                return;
            }

            scene.renderer.setClearColor(0x000000, 0);

        });
        //QR-Code generieren
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href, //holt die aktuelle URL
            width: 300,
            height: 300,
        });
    </script>

</body>

</html>
